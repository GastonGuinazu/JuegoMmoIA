<div class="login-panel">
  @if (pendingCharacters(); as chars) {
    <div class="login-panel__pick">
      <span class="login-panel__label">Elegí personaje:</span>
      @for (c of chars; track c.id) {
        <button type="button" class="login-panel__btn" (click)="pickCharacter(c.id)">
          {{ c.name }} (Lv.{{ c.level }})
        </button>
      }
    </div>
  } @else {
    <div class="login-panel__tabs">
      <button
        type="button"
        class="login-panel__tab"
        [class.active]="mode() === 'login'"
        (click)="setMode('login')"
      >
        Entrar
      </button>
      <button
        type="button"
        class="login-panel__tab"
        [class.active]="mode() === 'register'"
        (click)="setMode('register')"
      >
        Crear cuenta
      </button>
    </div>
    <form class="login-panel__form" (ngSubmit)="submit()">
      <label class="login-panel__field">
        <span>Usuario</span>
        <input type="text" [(ngModel)]="username" name="username" autocomplete="username" />
      </label>
      <label class="login-panel__field">
        <span>Contraseña</span>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
        />
      </label>
      @if (mode() === 'register') {
        <label class="login-panel__field">
          <span>Nombre del personaje</span>
          <input type="text" [(ngModel)]="characterName" name="characterName" autocomplete="off" />
        </label>
        <label class="login-panel__field">
          <span>Clase</span>
          <select [(ngModel)]="characterClass" name="characterClass">
            @for (opt of classOptions; track opt.value) {
              <option [value]="opt.value">{{ opt.label }}</option>
            }
          </select>
        </label>
      }
      <button type="submit" class="login-panel__btn login-panel__btn--primary" [disabled]="busy()">
        {{ busy() ? 'Un momento...' : mode() === 'login' ? 'Entrar' : 'Crear cuenta' }}
      </button>
    </form>
    @if (error(); as msg) {
      <p class="login-panel__error" role="alert">{{ msg }}</p>
    }
  }
</div>
